name: offbeat
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-offbeat}
      MYSQL_USER: ${DB_USERNAME:-offbeat}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run python3 scripts/configure.py first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run python3 scripts/configure.py first}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 4s
      retries: 30
    mem_limit: 512m
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-offbeat}
      DB_USERNAME: ${DB_USERNAME:-offbeat}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV:-local}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, 'php -r ''exit(extension_loaded("pdo_mysql") ? 0 : 1);''']
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  db_data:
